themes:
- id: 1
  name: 和
  pairs:
  - keyword: 和
    context: 調和・共存の精神が空間や生活道具に表現される
    foreign_concept: 和谐 (héxié)
    foreign_culture: 中国
    foreign_context: 社会秩序と階層的均衡を重視する儒教的調和観
    rationale: 中国は政治的秩序を、日本は空間・器物への美的実践としての調和を重視する
    historical_note: 儒教の「和」が日本では対人的調和や共存の核心概念として独自発展した
  - keyword: 配慮
    context: 相手への気遣いがもてなしや包み方に現れる
    foreign_concept: Consideration
    foreign_culture: 西洋
    foreign_context: 相手の立場を思いやる合理的・言語的配慮
    rationale: 西洋は言葉で明示する配慮を、日本は察しと非言語的表現に宿る配慮を美徳とする
  - keyword: 謙譲と謙遜
    context: 自己を控え相手を立てる所作
    foreign_concept: Humility (Humilitas)
    foreign_culture: 西洋
    foreign_context: キリスト教的徳目として神の前に自己を低くする態度
    rationale: 日本は対人関係の調和を、西洋は絶対者（神）への従属を謙虚さの根本に置く
  - keyword: 遠慮
    context: 一歩引く美学としての所作
    foreign_concept: Modesty (謙遜)
    foreign_culture: 西洋
    foreign_context: 自己を低く見せる個人的な道徳的美徳
    rationale: 遠慮は集団の「場の空気」を守るための所作であり、西洋の個人的美徳とは性質が異なる
  - keyword: 場
    context: 場所に応じた行動規範
    foreign_concept: 場面 (chǎngmiàn)
    foreign_culture: 中国
    foreign_context: 状況や場面そのものを指す物理的・文脈的空間
    rationale: 中国は客観的な状況描写を指すが、日本は空間に宿る社会的規範や「空気」を含む
  - keyword: 間
    context: 沈黙や余白、音楽における余韻が持つ表現力
    foreign_concept: Pause (西洋音楽の休符)
    foreign_culture: 西洋
    foreign_context: 楽譜上の休止記号で音の不在を示す記号的概念
    rationale: 西洋の休符は音の不在を機能的に示すが、間は余韻と気配を内包する積極的な表現である
  - keyword: 中庸
    context: 極端を避けるバランス感覚
    foreign_concept: Golden Mean (メソテース)
    foreign_culture: 西洋
    foreign_context: アリストテレスが説いた理性的計算による徳の中間点
    rationale: 西洋は理性的計算による均衡を、日本は自然な調和と感性に基づいたバランスを重視する
  - keyword: 低頭
    context: 頭を下げる礼の文化
    foreign_concept: 叩头 (kòutóu)
    foreign_culture: 中国
    foreign_context: 床に額をつける最高位の礼で、皇帝への服従を示す
    rationale: 中国は権力への絶対服従を象徴するが、日本は相互的な敬意と調和を表す所作として発展した
  - keyword: 根回し
    context: 意思決定前の事前調整の慣習
    foreign_concept: Consensus building (合意形成)
    foreign_culture: 西洋
    foreign_context: 公式な議論の場での論理的妥協点の模索
    rationale: 日本は非公式な人間関係を通じた調整を、西洋は公開された場での論理的合意を重視する
  - keyword: 一期一会
    context: 今この出会いは二度と来ないという覚悟
    foreign_concept: Carpe Diem
    foreign_culture: 西洋
    foreign_context: 「今日を摘め」：不確実な未来に依存せず現在を享受する姿勢
    rationale: 一期一会は茶道の誠実さと緊張感を、Carpe Diemは「今この時」の享受を核心とする
  - keyword: おもてなし
    context: 見返りを求めない全人格的な歓待
    foreign_concept: Hospitality / 好客之道
    foreign_culture: 中国
    foreign_context: 礼儀と面子を前提とした、主客の地位を示す盛大な歓待
    rationale: 日本は先読みの奉仕と無償性を、中国は礼的義務と地位の誇示を重視する点で対照的である
  - keyword: お裾分け
    context: 良いものを近隣や知人と分かち合う慣行
    foreign_concept: Gift-Giving / 礼物文化
    foreign_culture: 中国
    foreign_context: 関係構築・互酬義務が明確な贈答・人脈文化
    rationale: 中国は戦略的な関係構築を目的とするが、日本は互酬性を意識しない共同体の自然な分配を旨とする
- id: 2
  name: 型
  pairs:
  - keyword: 型
    context: 定められた形式を習得し体現する
    foreign_concept: Canon
    foreign_culture: 西洋
    foreign_context: 権威ある正典として外部から参照される客観的基準
    rationale: 型は身体に内面化する実践（主観的習得）だが、Canonは外部から参照される基準である
  - keyword: 作法
    context: 決められた振る舞いの美学
    foreign_concept: Etiquette
    foreign_culture: 西洋
    foreign_context: 社会的規範に基づく礼儀作法の体系
    rationale: 作法は芸道に紐付く美的完成度を、エチケットは社会的合意に基づく実用性を重視する
  - keyword: 行儀
    context: 礼儀正しい所作
    foreign_concept: Manners
    foreign_culture: 西洋
    foreign_context: 社会的規範に基づく、他者への不快感を避ける礼儀
    rationale: 行儀は型を通じた人格形成を、西洋のMannersは円滑な社交という機能を重視する
  - keyword: 修練
    context: 繰り返しによる技の体得
    foreign_concept: deliberate practice
    foreign_culture: 西洋
    foreign_context: 意図的・分析的な反復練習による技能向上
    rationale: 修練は無我の境地を、deliberate practiceは論理的な分析と意識的改善を目指す
  - keyword: 技
    context: 職人・演奏者の熟練した技術
    foreign_concept: technique
    foreign_culture: 西洋
    foreign_context: 習得可能な方法論・標準化された手順としての技術
    rationale: 西洋は再現可能な手順を指すが、日本の「技」は身体と不可分の熟練を指す
  - keyword: 匠
    context: 極められた技を持つ職人・絵師
    foreign_concept: Master Craftsman (Meister)
    foreign_culture: 西洋
    foreign_context: ギルド制度における客観的な技能認定制度の最高位
    rationale: 西洋は社会的な技能認定を核心とし、匠は精神的境地や美的昇華を重視する
  - keyword: 家元制度
    context: 芸道の正統を血統・継承で管理する組織
    foreign_concept: Guild System
    foreign_culture: 西洋
    foreign_context: 技術保護を目的とした職人の水平的組合・資格制度
    rationale: 西洋は職業的利益のための組合だが、家元は垂直的な文化的権威を継承する点に独自性がある
  - keyword: 職人気質
    context: 妥協を排した技への純粋な献身
    foreign_concept: Craftsmanship
    foreign_culture: 西洋
    foreign_context: 専門的な職業倫理に基づく職人の誇り
    rationale: 日本は商業化を拒む精神的修練の側面が強く、西洋は専門的職業倫理としての側面が強い
  - keyword: 改善
    context: 現場主導の継続的小幅改良
    foreign_concept: Innovation
    foreign_culture: 西洋
    foreign_context: 非連続な破壊的革新を理想とするトップダウンの変化観
    rationale: 改善は現場での漸進的改良を、イノベーションは構造的・非連続な変革を指す
- id: 3
  name: 道
  pairs:
  - keyword: 道
    context: 技術を超えた精神的な道程
    foreign_concept: 道 (Dào)
    foreign_culture: 中国
    foreign_context: 万物の根本原理・自然の流れを示す哲学的宇宙論
    rationale: 中国は宇宙論的原理を指すが、日本は身体的鍛錬を通じた人格形成の実践を指す
  - keyword: 道理
    context: 物事の理＜ことわり＞
    foreign_concept: 理（lǐ）
    foreign_culture: 中国
    foreign_context: 宋明理学における宇宙・事物の普遍的な根本原理
    rationale: 中国は形而上学的な宇宙原理を、日本は実践的な社会的・人倫的な規範を重視する
  - keyword: 武士道
    context: 武士の精神的規範
    foreign_concept: 騎士道 (Chivalry)
    foreign_culture: 西洋
    foreign_context: 中世騎士の名誉・忠誠・礼節の倫理規範
    rationale: 武士道は死の美学と精神的純化を内包し、西洋の宗教的（キリスト教的）奉仕とは本質が異なる
  - keyword: 克己心
    context: 自己に打ち克つ精神・自己鍛錬
    foreign_concept: Enkrateia
    foreign_culture: 西洋
    foreign_context: 理性による欲望・感情の制御を目指すギリシア哲学の徳
    rationale: 克己心は修行・道の完成が目的だが、西洋は理性的徳の実現そのものが目的である
  - keyword: 求道
    context: 道を極めようとする姿勢
    foreign_concept: 求道 (qiú dào)
    foreign_culture: 中国
    foreign_context: 道（タオ）の理を知的・哲学的に探求すること
    rationale: 中国は哲学的・知的悟りを重視するが、日本は型を通じた身体的・直接的実践を重視する
- id: 4
  name: 気
  pairs:
  - keyword: 気
    context: 生命力・精神エネルギーを練り発する
    foreign_concept: 氣 (qì)
    foreign_culture: 中国
    foreign_context: 宇宙万物を構成する根源的エネルギー・物質
    rationale: 中国は宇宙論的・物質的概念だが、日本は精神修養や武道における主体的鍛錬の概念である
  - keyword: 気持ち
    context: 心の動き・思いやり
    foreign_concept: 情 (qíng)
    foreign_culture: 中国
    foreign_context: 感情を指すが、意志的・社会的義務（義理）の色彩が強い
    rationale: 日本は内面の繊細な情緒的揺らぎを、中国は対人関係における社会的義務を重視する
  - keyword: 気丈
    context: 困難な局面で動揺をコントロールする強い意志
    foreign_concept: Stoicism
    foreign_culture: 西洋
    foreign_context: 感情を理性で制御し、外的苦難に動じない静穏（アパテイア）を理想とする態度
    rationale: ストア哲学は感情を「断つ」静穏を理想とするが、気丈は感情の存在を前提に「抑え込む」意志を指す
  - keyword: 殺気
    context: 戦いにおける気配
    foreign_concept: 殺気 (shāqì)
    foreign_culture: 中国
    foreign_context: 戦場全体の死の気配、兵士の凶暴な集団的気勢
    rationale: 中国は戦場の集団的な空気を、日本は個人間の対峙における感覚的察知能力を指す
  - keyword: 空気
    context: 場の雰囲気を感じ取る感覚
    foreign_concept: reading the room
    foreign_culture: 西洋
    foreign_context: 場の状況を読み取る社交的スキル・意図解読
    rationale: 西洋は個人の意図解読に重点を置くが、日本は集団的調和を維持するための非言語的感覚を重視する
- id: 5
  name: 節
  pairs:
  - keyword: 節と節目
    context: 季節・人生の区切りを祝う行事
    foreign_concept: 節气 (Jiéqì)
    foreign_culture: 中国
    foreign_context: 農業暦に基づく24の季節区分
    rationale: 中国は自然暦・農業暦に基づくが、日本は人生儀礼や社会的な区切りへの意識へ転化した
  - keyword: 有終
    context: 物事を美しく終える達成感
    foreign_concept: Closure
    foreign_culture: 西洋
    foreign_context: 心理的な区切りをつけて前進するための終結感
    rationale: 西洋は心理的解放を重視するが、日本の有終（の美）は美的完成と余韻の美しさを重視する
  - keyword: 節度
    context: 度を超えない自制
    foreign_concept: Temperance
    foreign_culture: 西洋
    foreign_context: キリスト教的徳目としての禁欲・節制
    rationale: 日本の節度は調和（バランス）を、西洋のTemperanceは「罪」からの回避を根底に置く
  - keyword: けじめ
    context: 行事や節目で区切りをつける意識
    foreign_concept: Rite of passage
    foreign_culture: 西洋
    foreign_context: 宗教的儀式を伴う、社会的身分の変更を示す通過儀礼
    rationale: 西洋は神や社会への誓約を、日本は個人の内的規律や精神の締め直しを重視する
  - keyword: もったいない
    context: 物の本来の価値を無駄にする惜しさ
    foreign_concept: Waste / Thrift
    foreign_culture: 西洋
    foreign_context: 経済的損失としての無駄の忌避・節約行動
    rationale: 西洋は経済合理性が核となるが、日本は物に宿る霊的敬意を含んだ倫理観である
  - keyword: 引き際
    context: 退くべき時を見極め潔く身を引く美学
    foreign_concept: Exit Strategy
    foreign_culture: 西洋
    foreign_context: 損失を最小化するための合理的・戦略的撤退計画
    rationale: 西洋は合理的・戦略的な判断だが、日本は去り際の潔さという美学的・道義的判断を核心とする
  - keyword: 元服
    context: 社会的成人を共同体が承認する儀式
    foreign_concept: Coming-of-Age
    foreign_culture: 西洋
    foreign_context: 法的・宗教的な成人への移行・権利付与
    rationale: 西洋は権利・義務の付与を、日本は集団内での新たな役割の引き受けという精神性を重視する
- id: 6
  name: 情
  pairs:
  - keyword: 情
    context: 人間の感情の機微を描く
    foreign_concept: 情 (qíng)
    foreign_culture: 中国
    foreign_context: 感情を指す儒教的概念で、理性（礼）との調和を重視する
    rationale: 中国は社会的・理性的調和を、日本は曖昧さや共感的な感受性を重視する
  - keyword: 人情
    context: 人と人との温かい絆
    foreign_concept: 인정 (injŏng)
    foreign_culture: 韓国
    foreign_context: 直接的で情熱的な感情的絆・共同体としての強力な義務感
    rationale: 韓国は強力な集団的・家族的義務だが、日本は個人間の情緒的な温かみを強調する傾向がある
  - keyword: 義理
    context: 社会的な責務・恩返し・葛藤
    foreign_concept: 의리 (ŭiri)
    foreign_culture: 韓国
    foreign_context: 仁義・義侠心に基づく人間的道義と侠気
    rationale: 日本は社会的債務と人情の葛藤を内包し、韓国は強い感情的絆と侠気を重視する
  - keyword: 恩
    context: 受けた恵みへの感謝と報恩義務
    foreign_concept: 은혜 (ŭnhye)
    foreign_culture: 韓国
    foreign_context: 儒教的な互恵規範に基づく感謝と返礼の感覚
    rationale: 日本は武士道の主従関係と融合した重層的な義務だが、韓国は儒教的・家族的な互恵性が中心である
  - keyword: なさけ
    context: 他者への共感的な思いやり
    foreign_concept: 仁（rén）
    foreign_culture: 中国
    foreign_context: 儒教の中核徳目で、道徳的義務に基づく理性的な愛の実践
    rationale: 中国は理性的な愛の実践を指すが、日本は感情的共鳴（もののあわれ）を重視する
  - keyword: 内と外
    context: 身内と外部の厳格な区別
    foreign_concept: 우리/남 (ウリ/ナム)
    foreign_culture: 韓国
    foreign_context: 民族・血縁的な強固な一体感を示す「我々（ウリ）」
    rationale: 韓国は血縁的に固定されているが、日本は状況や「場」によって「内」の範囲が流動的に変化する
  - keyword: 本音と建前
    context: 表と裏の役割的な使い分け
    foreign_concept: 눈치 (ヌンチ)
    foreign_culture: 韓国
    foreign_context: 場の空気を読み、相手の意図を瞬時に察知する能力
    rationale: 韓国は察知能力に重点を置くが、日本は社会的役割に応じた二重構造（使い分け）そのものを重視する
  - keyword: 円満
    context: 丸く収まる調和・情緒的円滑さ
    foreign_concept: 和谐 (héxié)
    foreign_culture: 中国
    foreign_context: 国家・社会の秩序維持を目的とした、制度的・政治的な調和
    rationale: 中国は政治的・制度的な秩序だが、日本は対人関係における情緒的な円滑さを重視する
  - keyword: 他人
    context: 身内以外との距離感や境界線
    foreign_concept: stranger
    foreign_culture: 西洋
    foreign_context: 見知らぬ人への中立的・対等な接し方
    rationale: 西洋は個人として対等に扱うが、日本は内外区別の文脈で「警戒・疎遠」のニュアンスを含む
  - keyword: 甘え
    context: 他者への依存を許容する心理的構造
    foreign_concept: Dependence
    foreign_culture: 西洋
    foreign_context: 個人の自立を理想とし、依存を心理的な欠点として否定的に捉える
    rationale: 西洋は自律的個人を前提とするが、日本は依存（甘え）を受け容れることで人間関係を維持する
  - keyword: 世間
    context: 自分を取り巻く具体的な人間関係の網
    foreign_concept: Society
    foreign_culture: 西洋
    foreign_context: 個人の集合体としての抽象的・制度的な社会概念
    rationale: 西洋は契約に基づく抽象的な集合体だが、世間は「顔の見える範囲」の具体的な相互監視と絆を指す
  - keyword: はにかみ
    context: 恥ずかしさと奥ゆかしさが混じる肯定的な態度
    foreign_concept: Shyness
    foreign_culture: 西洋
    foreign_context: 社交上の欠点、あるいは克服すべき内向的な個人特性
    rationale: 西洋は社交の障害と見なされがちだが、日本は美徳（慎ましさ）として肯定的に評価される
- id: 7
  name: 忠
  pairs:
  - keyword: 忠
    context: 主君への絶対的忠誠
    foreign_concept: 忠（zhōng）
    foreign_culture: 中国
    foreign_context: 国家・天への普遍的徳目としての政治的忠誠
    rationale: 中国は公的な普遍的義務だが、日本は封建的主君への絶対的な「個人的」主従関係を核心とする
  - keyword: 奉公
    context: 主に仕え、身を捧げる精神
    foreign_concept: 效忠 (xiào zhōng)
    foreign_culture: 中国
    foreign_context: 君主・国家への忠誠であり、儒教的な契約的義務に近い
    rationale: 中国は国家への普遍的義務だが、日本は人格的な主従関係における自己犠牲を強調する
  - keyword: 忠義
    context: 忠誠と正義の物語
    foreign_concept: 忠義 (zhōngyì)
    foreign_culture: 中国
    foreign_context: 天命や普遍的道義に従うことが優先される、道徳的な忠
    rationale: 中国は不義の君主への忠を否定しうるが、日本は（不義であっても）絶対的な主従の絆を重視する
  - keyword: 孝
    context: 親への絶対的な孝行
    foreign_concept: 효도 (hyodo)
    foreign_culture: 韓国
    foreign_context: 儒教的規範として、親への絶対的服従を最高徳目として重視
